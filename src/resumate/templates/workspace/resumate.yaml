# Resumate workspace settings. This file marks the root of your career workspace.
style:
  layout: modern         # modern: left-aligned sans header, accent color, ruled headings
                         # classic: centered serif header, underlined headings, all black
  entry_heading: stacked # stacked: `Title | dates`, then `Org | Location` (parsed cleanly by
                         #   Workday's resume autofill in testing)
                         # one_line: `Title | Org | Location | dates`, more compact, untested
  date_align: inline     # inline: `Title | Mar 2022 - Present`, keeps dates with their entry
                         # right: dates flush right; some parsers detach them from the entry
  # font: Times-Roman    # override the layout's font: Helvetica | Times-Roman | Courier
  accent: "#1F3A5F"      # modern layout: color for your name, headings, and links
  page_size: letter      # letter | a4
  base_size: 10          # body font size in points
  margin_in: 0.6         # page margins in inches
  max_pages: 1           # `resumate check` errors if the resume runs longer
