# resumate:example
# ^ This file is SAMPLE CONTENT. Give your agent your current resume (PDF, Word, Markdown,
#   or text) and it will rewrite it here, then delete the marker line above.
#
# MASTER RESUME
#
# Everything you've done worth mentioning lives here, even if it won't fit on one page.
# Each application starts from a copy of this file; you (or your agent) comment out
# lines with `#` or delete them to tailor it. `resumate build master` compiles this file.
#
# Format notes:
#   - Inline Markdown works in any text: **bold**, *italic*, [link text](https://...)
#   - Each section has one of: entries, skills, certificates, bullets, or text
#   - Entries take: title, org, location, start, end (or `dates`), summary, bullets
#   - Degrees take: title (the school), degree, major, minor, location, dates
#   - Parser-safe habits (`resumate check` warns about each): plain org names with no
#     commas or parentheses, a `City, ST` location on every job, no dates in the summary,
#     phone without +1, and plain hyphens instead of en or em dashes.
#   - Certificates take: name, issuer, issued, expires, credential_id, url
#   - Put numbers in bullets whenever you can; agents can't invent metrics for you.
#   - It's fine to keep a few more bullets than you'd ever use: a richer master
#     gives agents more to choose from when tailoring.

